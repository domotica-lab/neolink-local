name: Tests
on:
  push:
  pull_request:

jobs:
  addon:
    name: Add-on config generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash neolink_local/tests/run-tests.sh

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component==0.13.316 PyTurboJPEG
      - run: pytest -q
